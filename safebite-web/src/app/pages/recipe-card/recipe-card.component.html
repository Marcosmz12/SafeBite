<div class="card" [routerLink]="['/receta', receta.id]">
  
  <div class="image-box">
    <!-- Usamos la imagen de la receta -->
    <img [src]="receta.imagen_url" [alt]="receta.titulo" />
  </div>

  <div class="content">
    <h3>{{ receta.titulo }}</h3>
    <!-- Cambiado aquí para usar la traducción -->
    <span class="ver-mas">{{ langService.t().rec_ver_receta }} →</span>
  </div>

</div>
