<div class="main-container">
  <div class="contact-card">
    
    <div class="contact-header">
      <h1>Contacto <span>SafeBite</span></h1>
      <p>¿Tienes dudas sobre alérgenos o nuestra plataforma? Escríbenos y te ayudaremos en menos de 24h.</p>
    </div>

    <form class="contact-form" (submit)="enviarMensaje($event)">
      
      <div class="form-grid">
        <div class="input-group">
          <label>Nombre completo</label>
          <input type="text" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="input-group">
          <label>Correo electrónico</label>
          <input type="email" placeholder="tu@email.com" required>
        </div>

        <div class="input-group full-width">
          <label>Tu mensaje</label>
          <textarea rows="4" placeholder="Cuéntanos detalladamente tu consulta..." required></textarea>
        </div>
      </div>

      <div class="form-footer">
        <button type="submit" class="btn-submit">
          Enviar Mensaje
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>

    </form>

  </div>
</div>
