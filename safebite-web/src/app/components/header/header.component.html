<header class="navbar">
  <div class="logo-container">
    <a routerLink="/" class="logo-link">SAFEBITE</a>
  </div>

  <nav class="nav-menu">
    <a routerLink="/recetas" routerLinkActive="active">Recetas</a>
    <a routerLink="/comparador">Productos</a>
    <a routerLink="/subir">Subir receta</a>
    <a routerLink="/contacto">Contacto</a>
  </nav>

  <div class="auth-container">
    @if (user$ | async; as user) {
    <!-- PERFIL DE USUARIO LOGUEADO -->
    <div class="user-profile">
      <div class="user-info" routerLink="/perfil" style="cursor: pointer">
        <div class="user-avatar">
          {{ user.email?.charAt(0)?.toUpperCase() }}
        </div>
        <div class="user-details">
          <span class="user-welcome">Hola,</span>
          <span class="user-name">{{ user.email?.split('@')?.[0] }}</span>
        </div>
      </div>
      <button (click)="logout()" class="btn-salir">Salir</button>
    </div>
    } @else {
    <!-- BOTONES DE REGISTRO/LOGIN -->
    <app-auth-button
      label="Inicia Sesión"
      type="secondary"
      routerLink="/login"
    ></app-auth-button>
    <app-auth-button
      label="Regístrate"
      type="primary"
      routerLink="/register"
    ></app-auth-button>
    }
  </div>
</header>
