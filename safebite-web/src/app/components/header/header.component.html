<header class="navbar">
  <div class="logo-container">
    <a routerLink="/" class="logo-link">SAFEBITE</a>
  </div>

  <nav class="nav-menu">
    <!-- Usamos t().nombre_de_la_llave -->
    <a routerLink="/recetas" routerLinkActive="active">{{ langService.t().recetas }}</a>
    <a routerLink="/comparador">{{ langService.t().productos }}</a>
    <a routerLink="/subir-receta">{{ langService.t().subir_receta }}</a>
    <a routerLink="/contacto">{{ langService.t().contacto }}</a>
  </nav>

  <div class="auth-container">
  <!-- NUEVO SELECTOR DOBLE DE IDIOMA -->
 <!-- NUEVO SELECTOR DOBLE CON BANDERAS -->
  <div class="language-selector">
    <button 
      (click)="langService.setLanguage('es')" 
      [class.active]="langService.currentLang() === 'es'"
      class="btn-flag">
      <img src="/spain-flag.jpg" alt="ES" class="flag-img">
      <span>ES</span>
    </button>
    
    <span class="lang-divider">|</span>
    
    <button 
      (click)="langService.setLanguage('en')" 
      [class.active]="langService.currentLang() === 'en'"
      class="btn-flag">
      <img src="/uk-flag.jpg" alt="EN" class="flag-img">
      <span>EN</span>
    </button>
  </div>
  
  @if (user$ | async; as user) {
    <!-- ... resto de tu código del perfil igual ... -->
    <div class="user-profile">
      <div class="user-info" routerLink="/perfil" style="cursor: pointer">
        <div class="user-avatar">{{ user.email?.charAt(0)?.toUpperCase() }}</div>
        <div class="user-details">
          <span class="user-welcome">{{ langService.t().hola }}</span>
          <span class="user-name">{{ user.email?.split('@')?.[0] }}</span>
        </div>
      </div>
      <button (click)="logout()" class="btn-salir">{{ langService.t().salir }}</button>
    </div>
  } @else {
    <!-- ... botones de login/registro ... -->
    <app-auth-button [label]="langService.t().login" type="secondary" routerLink="/login"></app-auth-button>
    <app-auth-button [label]="langService.t().registro" type="primary" routerLink="/register"></app-auth-button>
  }
</div>
</header>
