<!-- Toda la tarjeta es ahora el enlace al detalle -->
<div class="card" [routerLink]="['/receta', receta.id]">
  
  <div class="image-box">
    <!-- Usamos la imagen de la receta -->
    <img [src]="receta.imagenUrl" [alt]="receta.titulo" />
  </div>

  <div class="content">
    <h3>{{ receta.titulo }}</h3>
    <span class="ver-mas">Ver receta →</span>
  </div>

</div>
