<div class="chat-wrapper" [class.is-open]="isOpen" role="region" [attr.aria-label]="langService.t().chat_header">
  
  <!-- UN SOLO BOTÓN FLOTANTE (FAB) -->
  <button class="chat-fab" (click)="abrirChat()" *ngIf="!isOpen" aria-haspopup="dialog">
    <span class="icon">💬</span>
    {{ langService.t().btn_asistente }}
  </button>

  <!-- VENTANA DE CHAT -->
  <div class="chat-window" *ngIf="isOpen" role="dialog">
    <!-- CABECERA -->
    <div class="chat-header">
      <!-- Botón Atrás / Cerrar -->
      <button class="close-btn" (click)="isOpen = false" [title]="langService.currentLang() === 'es' ? 'Cerrar' : 'Close'">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path
            fill="currentColor"
            d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"
          />
        </svg>
      </button>

      <div class="header-info">
        <div class="status-dot"></div>
        <span>{{ langService.t().chat_header }}</span>
      </div>
    </div>

    <!-- CUERPO DE MENSAJES -->
    <div class="chat-messages" #scrollMe role="log" aria-live="polite">
      
      <!-- CARICATURA DE SALUDO -->
    <div class="bot-greeting-avatar">
      <img src="/hojachatbot.png" alt="Mascota SafeBite" class="mascot-img">
    </div>

      <!-- Listado de mensajes -->
      @for (msg of messages; track msg.text) {
        <div [ngClass]="msg.type" class="message-wrapper">
      
          <!-- SOLO dibujamos la burbuja si el mensaje tiene texto real -->
          @if (msg.text && msg.text !== '') {
            <div class="bubble">
              {{ msg.text }}
            </div>
          }

          <!-- Botones de Opciones Rápidas -->
          @if (msg.options && msg.type === 'bot') {
          <div class="options-grid">
            @for (opt of msg.options; track opt) {
              <!-- SOLO dibuja el botón si 'opt' tiene texto real -->
              @if (opt && opt.trim() !== '') {
                <button (click)="sendMessage(opt)" class="opt-btn">
                  {{ opt }}
                </button>
              }
            }
          </div>
        }
        </div>
      }

      <!-- EFECTO "ESTÁ ESCRIBIENDO" -->
      @if (isTyping()) {
        <div class="message-wrapper bot">
          <div class="bubble typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      }
    </div>

    <!-- INPUT DE TEXTO -->
    <div class="chat-input">
      <input
        [(ngModel)]="userInput"
        (keyup.enter)="sendMessage()"
        [placeholder]="langService.t().chat_placeholder"
        maxlength="100"
        aria-label="Mensaje"
      />

      <button
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || isTyping()"
        class="send-btn"
      >
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
        </svg>
      </button>
    </div>
  </div>
</div>
