<div class="upload-container">
  <div class="form-card">
    <header class="form-header">
      <h1>{{ langService.t().sub_nueva }}</h1>
    </header>

    <div class="recipe-form">
      <!-- FOTO -->
      <div class="image-upload-section">
        <label
          for="file-input"
          class="image-dropzone"
          [class.has-image]="imagePreview()"
        >
          @if (imagePreview()) {
          <img [src]="imagePreview()" alt="Vista previa" />
          } @else {
          <div class="placeholder-content">
            <span class="icon">📸</span>
            <p>{{ langService.t().sub_foto }}</p>
          </div>
          }
        </label>
        <input
          id="file-input"
          type="file"
          (change)="onFileSelected($event)"
          accept="image/*"
          hidden
        />
      </div>

      <div class="inputs-section">
        <div class="input-group">
          <label>{{ langService.t().sub_label_titulo }}</label>
          <input
            type="text"
            [(ngModel)]="nuevaReceta.titulo"
            [placeholder]="langService.t().sub_ph_titulo" />
          
        </div>

        <div class="input-group">
          <label>{{ langService.t().sub_label_cat }}</label>
          <select [(ngModel)]="nuevaReceta.categoria" class="custom-select">
            @for (cat of categorias; track cat) {
            <option [value]="cat">{{ getTraduccionCategoria(cat) }}</option>
            }
          </select>
        </div>

        <!-- LISTA DINÁMICA: INGREDIENTES -->
        <div class="dynamic-section">
          <label>{{ langService.t().sub_label_ing }}</label>
          <div class="input-with-btn">
            <input
              type="text"
              [(ngModel)]="nuevoIngrediente"
              (keyup.enter)="addIngrediente()"
              [placeholder]="langService.t().sub_ph_ing" />
            
            <button type="button" (click)="addIngrediente()">+</button>
          </div>
          <ul class="dynamic-list">
            @for (ing of ingredientesList(); track $index) {
            <li>
              <span>{{ ing }}</span>
              <button type="button" (click)="removeIngrediente($index)">
                ×
              </button>
            </li>
            }
          </ul>
        </div>

        <!-- LISTA DINÁMICA: PASOS -->
        <div class="dynamic-section">
          <label>{{ langService.t().sub_label_pasos }}</label>
          <div class="input-with-btn">
            <input
              type="text"
              [(ngModel)]="nuevoPaso"
              (keyup.enter)="addPaso()"
              [placeholder]="langService.t().sub_ph_pasos" />
            
            <button type="button" (click)="addPaso()">+</button>
          </div>
          <ol class="dynamic-list ordered">
            @for (paso of pasosList(); track $index) {
            <li>
              <div class="step-info">
                <strong>{{ $index + 1 }}.</strong> {{ paso }}
              </div>
              <button type="button" (click)="removePaso($index)">×</button>
            </li>
            }
          </ol>
        </div>
      </div>

      <!-- ETIQUETAS SIN -->
      <div class="allergens-selection">
        <h3>{{ langService.t().sub_label_tags }}</h3>
        <div class="chips-container">
          @for (a of alergenosDisponibles; track a) {
          <button
            type="button"
            (click)="toggleEtiqueta(a)"
            [class.selected]="nuevaReceta.etiquetas_sin.includes(a)"
            class="allergen-chip"
          >
            {{ getTraduccionTag(a) }}
          </button>
          }
        </div>
      </div>

      <button
        class="btn-publish"
        (click)="publicar()"
        [disabled]="isUploading() || !selectedFile"
      >
        {{ isUploading() ? langService.t().sub_publicando : langService.t().sub_btn_publicar }}
      </button>
    </div>
  </div>
</div>
